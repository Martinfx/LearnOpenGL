name: build

on:
  push:
  pull_request:
  workflow_dispatch: # run by hand to get release packages (see the package job)

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true # the level smoke tests load the real models and textures
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libglfw3-dev libglm-dev qt6-base-dev libgl-dev xvfb libgl1-mesa-dri
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -LE "smoke|golden"
      # Every level for 120 frames under xvfb + llvmpipe: fails on crashes, asserts and logged errors.
      - run: ctest --test-dir build --output-on-failure -L smoke
      # Golden images of the renderer (tests/golden): fixed views compared within a tolerance.
      - run: ctest --test-dir build --output-on-failure -L golden
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: build/tests/golden/
      # Install layout: assets as game.pak, OpenAL found next to the game through $ORIGIN.
      - run: cmake -S . -B build -DENGINE_PACKAGE_PAK=ON && cmake --build build && cmake --install build --component game --prefix stage
      - run: |
          ldd stage/fps_game | grep "stage/libopenal"
          stage/fps_pack stage/game.pak --list | tail -1
          rm -rf stage

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y git cmake ninja glfw glm qt6-base
          run: |
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_JOLT_SSE42=OFF
            cmake --build build
            ctest --test-dir build --output-on-failure || { cd build/tests && lldb --batch -o run -o bt ./engine_tests; exit 1; }

  # Release packages (tools/package.sh, tools/package.ps1): LTO, assets in game.pak, symbols
  # separately. Only for tags and manual runs: the packages are about 2 GB each.
  package:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0 # git describe needs the tags
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libglfw3-dev libglm-dev qt6-base-dev libgl-dev
      - if: runner.os == 'Linux'
        run: tools/package.sh
      - if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
      - if: runner.os == 'Windows'
        run: powershell -File tools/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            build-release/package/*.tar.gz
            build-release/package/*.zip
