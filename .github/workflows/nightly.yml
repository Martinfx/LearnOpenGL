name: nightly

# Sanitizer builds once a night (and on demand): unit tests and the level smoke
# tests under AddressSanitizer + UndefinedBehaviorSanitizer, unit tests under
# ThreadSanitizer (job system, async loading, audio).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libglfw3-dev libglm-dev libgl-dev xvfb libgl1-mesa-dri
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENGINE_BUILD_EDITOR=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libglfw3-dev libglm-dev libgl-dev
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENGINE_BUILD_EDITOR=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=thread" "-DCMAKE_CXX_FLAGS=-fsanitize=thread"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread" "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -LE smoke
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
